[project]
name = "garage-opener"
version = "0.1.0"
description = "Program to help manage garage s3 clusters declaratively"
requires-python = ">=3.13"
dependencies = [
    #
    "numpy",
    "matplotlib",
    "garage-admin-sdk",
]

[project.scripts]
garage-opener = "garage_opener.opener:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
garage-admin-sdk = { git = "https://git.deuxfleurs.fr/garage-sdk/garage-admin-sdk-python.git", rev = "709b9c1317e68b9f4ea5025ef8fa9df0d2ce899c" }
